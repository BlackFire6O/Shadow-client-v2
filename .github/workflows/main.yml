name: Build Shadow Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build
        working-directory: shadowclient

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Client
          path: shadowclient/build/libs/*.jar
